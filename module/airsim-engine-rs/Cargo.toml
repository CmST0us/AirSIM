[package]
name = "airsim-agent"
version = "2.0.0"
edition = "2024"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "airsim-agent"
path = "src/main.rs"

[dependencies]
# WebRTC Sans-I/O with pure-Rust DTLS + SRTP + native RFC 2198 RED
str0m = { version = "0.26.0", default-features = false, features = ["rust-crypto"] }

# Async runtime (single-threaded control plane; real-time audio uses dedicated SCHED_FIFO OS threads)
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "signal", "io-util", "macros"] }

# Pure-Rust TLS 1.2/1.3 (mTLS Ed25519 client + P-256 USB HTTPS server + ISRG Root X1)
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha" }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-pemfile = "2.2"
webpki-roots = "1.0"

# Lightweight WebSocket client over existing TlsStream (no built-in TLS bloat)
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography & X.509 (sharing RustCrypto crates with str0m-rust-crypto & rustls-rustcrypto)
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
subtle = "2"
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
x509-parser = "0.16"
pem = "3"

# Encoding, randomness, time, URL, OS syscalls
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
libc = "0.2"
time = { version = "0.3.47", features = ["formatting", "parsing"] }
url = "2"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
