<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>AirSIM · 添加设备</title>
<style>
:root{--bg:#f5f5f7;--paper:#fff;--ink:#1d1d1f;--muted:#626269;--line:#dedee3;--green:#0066cc;--hover:#0055ad;--soft:#eef4fc;--orange:#946200;--red:#b42318;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button{cursor:pointer;color:inherit;transition:background .16s,transform .16s}button:disabled{cursor:wait;opacity:.6}button:active:not(:disabled){transform:scale(.98)}a{color:inherit}button,a,input,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #007aff}button svg{display:none}[hidden]{display:none!important}.skip{position:fixed;top:-80px;left:16px;background:var(--paper);padding:14px;z-index:100}.skip:focus{top:8px}
header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(28px,calc((100vw - 1080px)/2));background:rgba(250,250,252,.85);backdrop-filter:blur(22px) saturate(160%);border-bottom:1px solid #0000000d}.brand{font-size:22px;font-weight:650;letter-spacing:-.8px;text-decoration:none;display:flex;gap:22px;align-items:center}.brand small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}.plain{border:0;background:transparent;color:var(--green);min-height:44px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border-radius:24px}.plain:hover{background:#007aff0a}.header-help{background:#fff9;color:var(--ink);border:1px solid #0000000a;min-height:36px;padding:7px 16px;font-size:12px}
main{max-width:1080px;margin:auto;padding:0 28px;min-height:calc(100dvh - 68px);display:flex;flex-direction:column}.rail{padding:34px 0 0;display:flex;justify-content:center}.rail-label,.rail-meta{display:none}.progress{margin:0;padding:6px;list-style:none;display:flex;gap:4px;background:#e9e9ed;border:1px solid #00000003;border-radius:30px}.progress li{display:flex;gap:9px;align-items:center;padding:9px 18px;font-size:12px;color:var(--muted);border-radius:24px;white-space:nowrap}.progress .num{font-variant-numeric:tabular-nums;font-size:11px}.progress .current{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 2px 7px #0000000a,0 0 1px #0000001a}.progress .current .num{color:var(--green)}.progress .complete{color:var(--green)}.document{width:100%;max-width:620px;margin:42px auto 0}.doc-top{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}.doc-top>span{display:none}.doc-top b{font-weight:500}.workspace{min-width:0}.content{display:flex;flex-direction:column;min-width:0}h1{font-size:46px;line-height:1.16;letter-spacing:-1.8px;font-weight:650;text-align:center;margin:0 0 18px}h1:focus{outline:0}.lead{font-size:16px;line-height:1.8;color:var(--muted);text-align:center;max-width:490px;margin:0 auto 32px}.steps{list-style:none;padding:0 24px;margin:0;background:var(--paper);border-radius:22px;box-shadow:0 2px 8px #00000003}.steps li{display:flex;gap:18px;align-items:center;padding:23px 0;min-height:98px}.steps li+li{border-top:1px solid var(--line)}.step-number{display:grid;place-items:center;flex-shrink:0;width:36px;height:36px;background:var(--bg);border-radius:50%;font-size:12px;font-weight:550;color:var(--muted);font-variant-numeric:tabular-nums}.steps b{font-size:16px;font-weight:600}.steps small{display:block;font-size:13px;line-height:1.7;color:var(--muted);margin-top:5px}.actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin-top:28px;padding:0 0 20px}.primary,.secondary{border:0;min-height:48px;padding:13px 25px;border-radius:25px;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:550}.primary{background:var(--green);color:#fff;min-width:210px}.primary:hover{background:var(--hover)}.secondary{background:#ebebef;color:var(--ink)}.secondary:hover{background:#dddde3}.under-action{flex-basis:100%;font-size:12px;color:var(--muted);line-height:1.7;text-align:center;margin:0}.footnote{display:flex;justify-content:center;align-items:center;gap:10px;font-size:11px;color:var(--muted);margin:6px 0 20px;flex-wrap:wrap}.footnote .plain{font-size:11px;min-height:32px;padding:5px 9px}.preview-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 0;margin-top:auto;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}.preview-tools{display:flex;gap:4px;flex-wrap:wrap}.preview-tools .plain{font-size:11px;min-height:36px;color:var(--muted);padding:8px 10px}.preview-label{line-height:1.6}
.device-summary{padding:21px 24px;margin:0 0 16px;background:var(--paper);border-radius:18px;display:flex;align-items:center;gap:14px}.device-icon{display:none}.device-summary strong{font-size:18px;font-weight:600;letter-spacing:.1px}.device-summary small{display:block;margin-top:7px;font-size:12px;line-height:1.6;color:var(--muted)}.status-list{margin:0;padding:3px 24px;background:var(--paper);border-radius:18px}.status-row{display:flex;justify-content:space-between;gap:18px;padding:14px 0;font-size:14px;line-height:1.6}.status-row+.status-row{border-top:1px solid var(--line)}.status-row dt{color:var(--muted)}.status-row dd{margin:0;text-align:right}.ok{color:#21703e}.warn{color:var(--orange)}.info{padding:17px 20px;background:var(--soft);border-radius:16px;font-size:13px;line-height:1.8;color:var(--muted);margin:16px 0}.error-icon,.success-symbol{align-self:center;font-size:12px;font-weight:550;padding:7px 13px;border-radius:16px;margin-bottom:18px}.error-icon{background:#fff0d7;color:var(--orange)}.success-symbol{background:#e7f3eb;color:#21703e}.back{align-self:start;margin:-12px 0 12px;padding-left:0}.install-list{padding:6px 24px;margin:0;background:var(--paper);border-radius:18px;list-style:none}.install-list li{display:flex;align-items:center;gap:16px;padding:18px 0;color:var(--muted);font-size:14px}.install-list li+li{border-top:1px solid var(--line)}.install-list li.active{color:var(--green)}.bullet{width:20px;font-variant-numeric:tabular-nums}.loading-line{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin:25px 0 16px}.loading-line:after{content:'';display:block;width:30%;height:100%;border-radius:4px;background:var(--green);animation:loading 1.5s linear infinite}@keyframes loading{from{transform:translateX(-100%)}to{transform:translateX(340%)}}.qr-layout{display:flex;justify-content:center;align-items:center;gap:28px;margin:16px 0 24px}.qr{width:174px;flex-shrink:0;padding:14px;background:white;border-radius:18px}.qr svg{width:100%;display:block}.pair-instructions{font-size:14px;color:var(--muted);line-height:2}.pair-instructions b{color:var(--ink);font-weight:600}.waiting{font-size:12px;color:var(--green)}.pin{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--paper);border-radius:16px;padding:17px 22px;font-size:13px;margin-bottom:12px}.pin strong{font-size:24px;letter-spacing:4px;font-weight:500;font-variant-numeric:tabular-nums}.mobile-content{display:none}
dialog{padding:0;border:1px solid #ffffff80;border-radius:28px;width:520px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 40px);background:var(--bg);color:var(--ink);box-shadow:0 24px 80px #00000026}dialog::backdrop{background:#14141b45;backdrop-filter:blur(8px)}.dialog-inner{padding:28px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.dialog-head h2{margin:0;font-size:24px;font-weight:650;letter-spacing:-.6px}.close{width:36px;height:36px;flex-shrink:0;border:0;border-radius:50%;background:#e7e7ec;font-size:23px;color:var(--muted)}.close:hover{background:#dcdce2}.dialog-copy{font-size:14px;line-height:1.8;color:var(--muted)}.dialog-note{font-size:11px;line-height:1.8;color:var(--muted);margin:20px 0 0;text-align:center}.pick-row{display:flex;gap:14px;align-items:center;background:var(--paper);border:2px solid transparent;border-radius:16px;padding:20px;margin:10px 0;cursor:pointer}.pick-row:has(input:checked){border-color:var(--green)}.pick-row input{accent-color:var(--green);width:18px;height:18px}.pick-row strong{font-size:15px;display:block}.pick-row small{font-size:12px;color:var(--muted);display:block;margin-top:5px}.dialog-actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px}.dialog-actions .primary{min-width:150px}.help-list details{padding:18px 0;border-bottom:1px solid var(--line)}.help-list summary{cursor:pointer;font-size:14px;font-weight:550;line-height:1.6}.help-list p{font-size:13px;line-height:1.9;color:var(--muted);margin-bottom:0}.scenario-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.scenario-list button{background:var(--paper);font-size:12px;justify-content:start;text-align:left;min-width:0;border-radius:12px;padding:12px}.phone-preview{max-width:390px}.phone-header{font-size:12px;color:var(--muted);margin-bottom:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#29292e;color:#fff;padding:16px 22px;border-radius:18px;max-width:calc(100vw - 32px);font-size:13px;z-index:50}.review-note{font-size:12px;color:var(--muted)}
@media(min-height:850px){.document{margin-top:58px}.actions{margin-top:32px}.footnote{margin-bottom:36px}}
@media(max-width:600px){header{height:60px;padding:0 20px}.brand{font-size:21px;gap:14px}.brand small{font-size:11px}.header-help{font-size:11px;padding:7px 12px}main{padding:0 20px;min-height:calc(100dvh - 60px)}.rail{padding-top:24px}.progress{width:100%;gap:0;padding:5px}.progress li{flex:1;justify-content:center;padding:9px 6px;gap:6px;font-size:11px}.progress .num{font-size:10px}.document{margin-top:35px}.doc-top{font-size:11px}h1{font-size:34px;letter-spacing:-1px;margin-bottom:16px}.lead{font-size:14px;line-height:1.8;margin-bottom:25px}.steps{padding:0 18px;border-radius:20px}.steps li{gap:14px;padding:20px 0;align-items:start}.step-number{width:28px;height:28px;font-size:10px}.steps b{font-size:15px}.steps small{font-size:12px}.actions{margin-top:24px}.actions>.primary{width:100%}.footnote{gap:0;text-align:center;margin-bottom:25px}.preview-bar{display:block;padding:14px 0}.preview-tools{margin:8px -8px 0;gap:0}.preview-tools .plain{padding:8px}.qr-layout{gap:15px}.qr{width:132px;padding:10px}.pair-instructions{font-size:12px}.pin{padding:16px;font-size:12px}.pin strong{font-size:22px;letter-spacing:3px}.device-summary{padding:18px}.status-list{padding:3px 18px}.status-row{font-size:13px;gap:12px}.dialog-inner{padding:22px}.dialog-head h2{font-size:22px}.dialog-actions .primary{min-width:0;flex:1}.under-action{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(prefers-reduced-transparency:reduce){header{background:#fafafc;backdrop-filter:none}dialog::backdrop{backdrop-filter:none;background:#14141b99}}
.mode-switch button{border:0;border-radius:24px;padding:11px 20px;background:transparent;color:var(--muted);font-size:12px;min-height:40px}.mode-switch button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 2px 7px #0000000a}.prerequisite{font-size:12px;line-height:1.8;color:var(--muted);margin:0 12px 16px;text-align:center}.flow-note{font-size:12px;line-height:1.8;text-align:center;color:var(--muted);margin:22px 8px 8px}.document{margin-bottom:24px}@media(max-width:600px){.mode-switch button{padding:10px 8px;flex:1;font-size:11px}.steps small{overflow-wrap:anywhere}}
.user-document{margin:110px auto 50px;max-width:540px}.device-choice{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;border:1px solid #00000005;background:var(--paper);border-radius:22px;padding:26px;text-align:left;min-height:104px;box-shadow:0 2px 8px #00000003}.device-choice:hover{background:var(--soft)}.device-choice strong{font-size:19px;font-weight:600;display:block}.device-choice small{display:block;font-size:12px;color:var(--muted);margin-top:8px}.choice-label{font-size:13px;color:var(--green)}.user-document .device-summary{padding:25px}.user-document .lead{margin-bottom:36px}@media(max-width:600px){.user-document{margin-top:70px}.device-choice{padding:22px}}
</style></head>
<body><a class="skip" href="#main-content">跳到设备</a>
<header><a class="brand" href="#" id="home">AirSIM <small>添加设备</small></a><button class="plain header-help" id="help-button">连接帮助</button></header>
<main><div class="document user-document"><section class="workspace" aria-label="添加设备"><div class="content" id="main-content" aria-live="polite"></div></section></div><footer class="preview-bar"><span class="preview-label">交互设计稿 · 示例设备</span><div class="preview-tools"><button class="plain" data-preview="device">设备列表</button><button class="plain" data-preview="empty">无设备</button><button class="plain" data-preview="failed">连接失败</button><button class="plain" data-preview="done">连接完成</button></div></footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-inner"><div class="dialog-head"><h2 id="dialog-title">连接帮助</h2><button class="close" aria-label="关闭" id="close-dialog">×</button></div><div class="help-list"><details open><summary>找不到设备</summary><p>检查设备电源和网络连接。</p></details><details><summary>连接失败</summary><p>检查手机与设备的网络连接。点击“重试连接”。</p></details></div></div></dialog>
<script>
const $=s=>document.querySelector(s);
let state='device';
const button=(label,action,kind='primary')=>`<button class="${kind}" data-action="${action}">${label}</button>`;
const device=()=>`<div class="device-summary"><div><strong>RM500</strong><small>设备标识 · A7K2</small></div></div>`;
const heading=(title,copy)=>`<h1 tabindex="-1">${title}</h1><p class="lead">${copy}</p>`;
function render(){let h='';
if(state==='device')h=heading('添加设备','选择要连接的设备。')+`<button class="device-choice" data-action="confirm"><span><strong>RM500</strong><small>设备标识 · A7K2</small></span><span class="choice-label">选择</span></button><p class="flow-note">核对设备名称与标识。</p>`;
if(state==='confirm')h=heading('确认设备','连接此设备，使用通话和短信功能。')+device()+`<div class="actions">${button('连接设备','waiting')}${button('返回设备列表','device','plain')}</div>`;
if(state==='waiting')h=heading('等待设备响应','保持设备供电与网络连接。')+device()+`<div class="loading-line" aria-hidden="true"></div><div class="actions">${button('取消连接','device','secondary')}</div>`;
if(state==='empty')h=heading('未发现设备','检查设备电源和网络连接。')+`<div class="actions">${button('查找设备','search')}${button('连接帮助','help','plain')}</div>`;
if(state==='search')h=heading('查找设备','保持设备供电与网络连接。')+`<div class="loading-line" aria-hidden="true"></div><div class="actions">${button('停止查找','empty','secondary')}</div>`;
if(state==='failed')h=heading('连接失败','检查手机与设备的网络连接。')+device()+`<div class="actions">${button('重试连接','waiting')}${button('返回设备列表','device','plain')}</div>`;
if(state==='done')h=heading('设备已连接','打开 AirSIM，查看设备。')+device()+`<div class="actions">${button('完成','device')}</div>`;
$('#main-content').innerHTML=h;}
function go(next){state=next;render();$('#main-content h1')?.focus({preventScroll:true});}
function help(){$('#dialog').showModal();}
document.addEventListener('click',e=>{const preview=e.target.closest('[data-preview]');if(preview){go(preview.dataset.preview);return}const button=e.target.closest('[data-action]');if(button){button.dataset.action==='help'?help():go(button.dataset.action)}});
$('#help-button').onclick=help;$('#close-dialog').onclick=()=>$('#dialog').close();$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});$('#home').onclick=e=>{e.preventDefault();go('device')};render();
</script></body></html>
