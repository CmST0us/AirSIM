name: airsim-r4-test
x-business: &business
  image: airsim-r4-test-business:local
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  user: "${AIRSIM_UID:-65532}:${AIRSIM_GID:-65532}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  tmpfs: ["/tmp:size=8m,mode=1777"]
  restart: "no"
x-database: &database
  DATABASE_HOST: postgres
  DATABASE_PASSWORD_FILE: /run/secrets/database-password
services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    environment:
      POSTGRES_DB: airsim
      POSTGRES_USER: airsim
      POSTGRES_PASSWORD_FILE: /run/secrets/database-password
    volumes:
      - database:/var/lib/postgresql/data
      - ${AIRSIM_SECRET_DIR:?set external secrets directory}/database-password:/run/secrets/database-password:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airsim -d airsim"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 256m
    pids_limit: 128
  migrate:
    <<: *business
    entrypoint: [/bin/airsim-migrate]
    environment: *database
    volumes:
      - ${AIRSIM_SECRET_DIR}/database-password:/run/secrets/database-password:ro
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
  admin:
    <<: *business
    profiles: [tools]
    entrypoint: [/bin/airsim-admin]
    environment:
      <<: *database
      AIRSIM_SERVER_ID: ${AIRSIM_SERVER_ID:-}
      AIRSIM_API_ORIGIN: ${AIRSIM_API_ORIGIN:?}
      AIRSIM_DEVICE_ORIGIN: ${AIRSIM_DEVICE_ORIGIN:?}
      AIRSIM_MEDIA_ORIGIN: ${AIRSIM_MEDIA_ORIGIN:?}
    volumes:
      - ${AIRSIM_SECRET_DIR}:/protected
      - ${AIRSIM_SECRET_DIR}/database-password:/run/secrets/database-password:ro
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}
  control:
    <<: *business
    environment:
      <<: *database
      AIRSIM_API_ORIGIN: ${AIRSIM_API_ORIGIN:?}
      AIRSIM_DEVICE_ORIGIN: ${AIRSIM_DEVICE_ORIGIN:?}
      AIRSIM_MEDIA_ORIGIN: ${AIRSIM_MEDIA_ORIGIN:?}
      EDGE_TOKEN_FILE: /run/secrets/edge-token
      MEDIA_TOKEN_FILE: /run/secrets/media-token
      COMMAND_HMAC_FILE: /run/secrets/command-hmac
      DEVICE_CA_FILE: /run/secrets/device-ca.pem
    volumes:
      - ${AIRSIM_SECRET_DIR}/database-password:/run/secrets/database-password:ro
      - ${AIRSIM_SECRET_DIR}/identity/device-ca.pem:/run/secrets/device-ca.pem:ro
      - ${AIRSIM_SECRET_DIR}/identity/edge-token:/run/secrets/edge-token:ro
      - ${AIRSIM_SECRET_DIR}/identity/media-token:/run/secrets/media-token:ro
      - ${AIRSIM_SECRET_DIR}/identity/command-hmac:/run/secrets/command-hmac:ro
    networks: [database, control, media]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /bin/airsim-server, healthcheck]
      interval: 2s
      timeout: 3s
      retries: 30
  media:
    <<: *business
    entrypoint: [/bin/airsim-media]
    environment:
      MEDIA_TOKEN_FILE: /run/secrets/media-token
    volumes:
      - ${AIRSIM_SECRET_DIR}/identity/media-token:/run/secrets/media-token:ro
    networks: [media]
    depends_on:
      control: {condition: service_healthy}
    healthcheck:
      test: [CMD, /bin/airsim-media, healthcheck]
      interval: 2s
      timeout: 3s
      retries: 30
  edge:
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    user: "${AIRSIM_UID:-65532}:${AIRSIM_GID:-65532}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    pids_limit: 64
    mem_limit: 128m
    ports: ["127.0.0.1:${AIRSIM_EDGE_PORT:?}:8443"]
    volumes:
      - ${AIRSIM_SECRET_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AIRSIM_SECRET_DIR}/identity/device-ca.pem:/run/secrets/device-ca.pem:ro
      - ${AIRSIM_SECRET_DIR}/identity/edge-token:/run/secrets/edge-token:ro
      - ${AIRSIM_SECRET_DIR}/tls:/run/tls:ro
      - tls-state:/data
      - edge-config:/config
    environment:
      AIRSIM_TEST_HEALTH_ORIGIN: ${AIRSIM_API_ORIGIN}
    healthcheck:
      test: [CMD-SHELL, 'curl --noproxy "*" --fail --silent --cacert /run/tls/root.pem --connect-to "api.airsim.test:$${AIRSIM_TEST_HEALTH_ORIGIN##*:}:127.0.0.1:8443" "$${AIRSIM_TEST_HEALTH_ORIGIN}/healthz" >/dev/null']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [ingress, control, media]
    depends_on:
      control: {condition: service_healthy}
      media: {condition: service_healthy}
networks:
  ingress: {}
  database: {internal: true}
  control: {internal: true}
  media: {internal: true}
volumes:
  database:
  tls-state:
  edge-config:
